name: Release Automation

on:
  push:
    branches:
      - 'v*'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build & Release Artifacts
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Sync update.json manifest
        run: ./gradlew :app:syncUpdateJson

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Decode Keystore if provided
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ env.KEYSTORE_BASE64 }}" | base64 --decode > release.jks

      - name: Build Release APK
        run: ./gradlew assembleRelease -PRELEASE_STORE_FILE=release.jks
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Package Release Assets
        run: |
          mkdir -p release_assets
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" release_assets/app-release.apk
            echo "✅ Found and copied $APK_FILE to release_assets/app-release.apk"
          else
            echo "❌ Error: No APK found in build outputs!"
            exit 1
          fi
          cp update.json release_assets/update.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/app-release.apk
            release_assets/update.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
